server.port=8000
spring.application.name=sprintjava
spring.servlet.multipart.max-file-size=160MB
spring.servlet.multipart.max-request-size=160MB
server.tomcat.connection-timeout=1800000
spring.jackson.property-naming-strategy=SNAKE_CASE


app.oracle.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
app.oracle.user=${ORACLE_USER:}
app.oracle.password=${ORACLE_PASSWORD:}

# Origens do front-end liberadas no CORS (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Serviço Python de análise de transcrições (vazio = usa a análise provisória em Java)
app.python.transcricao-url=${PYTHON_TRANSCRICAO_URL:}
app.usuario-padrao-id=${USUARIO_PADRAO_ID:1}
